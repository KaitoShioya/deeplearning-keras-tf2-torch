[project]
name = "deeplearning-keras-tf2-torch"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "KaitoShioya", email = "arm9lorderhax@gmail.com" }
]
dependencies = [
    "tensorflow>=2.19.0",
    "pandas>=2.3.1",
    "keras>=3.10.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "pip>=25.1.1",
    "ipykernel>=6.29.5",
    "black>=25.1.0",
    "scikit-learn>=1.7.0",
    "matplotlib>=3.10.3",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/deeplearning_keras_tf2_torch"]
